# Weekly, grouped dependency updates (#234). Actions are SHA-pinned (see
# .github/scripts/check_action_pins.py); Dependabot rewrites the SHA and the version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      github-actions-minor-patch: { patterns: ["*"], update-types: [minor, patch] }
    open-pull-requests-limit: 5

  # Live Observatory lives on the `eval-dashboard` trunk (#359); main tracks only /app/*.
  - package-ecosystem: uv
    directories: [/app/backend]
    schedule: { interval: weekly, day: monday }
    groups:
      python-minor-patch: { update-types: [minor, patch] }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directories: [/app/frontend]
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
    open-pull-requests-limit: 5

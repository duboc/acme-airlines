name: Agent Engine Deploy

# Keyless deploy via Workload Identity Federation (trusts refs/heads/main only, so it cannot run
# from a PR). Creates or updates `acme-customer-agent` then `acme-sales-agent` in place by display
# name, then records the engine ids on the Observatory dashboard and the demo Cloud Run services
# with --update-env-vars (all other settings are kept). Never triggered by pull requests.
# Design: docs/agent-engine/engines.md#deploy

on:
  push:
    branches: [main]
    paths:
      - "app/backend/src/acme/**"
      - "app/backend/pyproject.toml"
      - "app/backend/uv.lock"
      - ".github/workflows/agent-engine-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-engine-deploy
  cancel-in-progress: false

env:
  GOOGLE_CLOUD_PROJECT: ${{ vars.OBSERVATORY_PROJECT }}
  AGENT_ENGINE_SA: ${{ vars.AGENT_ENGINE_SA }}
  AGENT_ENGINE_STAGING_BUCKET: ${{ vars.AGENT_ENGINE_STAGING_BUCKET }}
  AGENT_ENGINE_LOCATION: ${{ vars.AGENT_ENGINE_LOCATION }}
  REGION: ${{ vars.OBSERVATORY_REGION }}
  DEMO_SERVICE: ${{ vars.IRROPS_DEMO_SERVICE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.OBSERVATORY_WIF_PROVIDER }}
          service_account: ${{ vars.OBSERVATORY_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Deploy or update the engines
        id: engines
        working-directory: app/backend
        run: |
          uv sync --frozen
          uv run python -m acme.engines.deploy

      # `^@^` makes `@` the pair delimiter, because the values contain commas.
      - name: Point the Observatory dashboard at the engines
        run: |
          gcloud run services update acme-observatory \
            --update-env-vars "^@^AGENT_ENGINES=${{ steps.engines.outputs.engines }}" \
            --region "$REGION" --project "$GOOGLE_CLOUD_PROJECT" --quiet

      - name: Record the engine names on the demo service (mode switch is owned by #164)
        run: |
          if [ -z "$DEMO_SERVICE" ]; then
            echo "::warning::IRROPS_DEMO_SERVICE is not set; skipping the demo update"; exit 0
          fi
          gcloud run services update "$DEMO_SERVICE" \
            --update-env-vars "AGENT_ENGINE_CUSTOMER=${{ steps.engines.outputs.customer }},AGENT_ENGINE_SALES=${{ steps.engines.outputs.sales }}" \
            --region "$REGION" --project "$GOOGLE_CLOUD_PROJECT" --quiet

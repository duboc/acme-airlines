name: Agent Engine Live Proof

# Opt-in, manual only (no push / pull_request trigger): runs presets 1-5 on the DEPLOYED engines
# and asserts the Cloud Trace spans per turn, plus no PII (#167). Keyless via WIF (main only).
# Design: docs/agent-engine/engines.md#proof

on:
  workflow_dispatch:
    inputs:
      customer_engine:
        description: Customer engine resource name (projects/<p>/locations/<l>/reasoningEngines/<id>)
        required: true
      sales_engine:
        description: Sales engine resource name
        required: true
      probe_calls:
        description: "Unary probe (#221): N back-to-back + N/2 spaced read-only Customer calls, then count traces (0 = skip)"
        default: "0"
      dump_inventory:
        description: Always write the trace-inventory artifact (it is also written on failure)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.OBSERVATORY_WIF_PROVIDER }}
          service_account: ${{ vars.OBSERVATORY_DEPLOYER_SA }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Run the live proof
        working-directory: app/backend
        env:
          ACME_LIVE_AGENT_ENGINE: "1"
          AGENT_ENGINE_CUSTOMER: ${{ inputs.customer_engine }}
          AGENT_ENGINE_SALES: ${{ inputs.sales_engine }}
          ACME_PROOF_TABLE: ${{ runner.temp }}/trace-table.md
          ACME_PROOF_INVENTORY: ${{ runner.temp }}/trace-inventory.json
          ACME_PROOF_DUMP: ${{ inputs.dump_inventory && '1' || '0' }}
          ACME_PROOF_LOGS: ${{ runner.temp }}/engine-logs.jsonl
        run: uv run pytest tests/live/test_agent_engine_traces.py -m live -q -k "not unary_probe and not forced_rebuild"
      - name: Forced cross-container rebuild (#279)
        working-directory: app/backend
        env:
          ACME_LIVE_AGENT_ENGINE: "1"
          AGENT_ENGINE_CUSTOMER: ${{ inputs.customer_engine }}
          AGENT_ENGINE_SALES: ${{ inputs.sales_engine }}
          ACME_PROOF_REBUILD: ${{ runner.temp }}/rebuild-summary.md
          ACME_PROOF_LOGS: ${{ runner.temp }}/rebuild-engine-logs.jsonl
        run: uv run pytest tests/live/test_agent_engine_traces.py -m live -q -s -k forced_rebuild
      - name: Unary probe (platform sampling vs exporter, #221)
        if: ${{ inputs.probe_calls != '0' }}
        working-directory: app/backend
        env:
          ACME_LIVE_AGENT_ENGINE: "1"
          AGENT_ENGINE_CUSTOMER: ${{ inputs.customer_engine }}
          AGENT_ENGINE_SALES: ${{ inputs.sales_engine }}
          ACME_PROBE_CALLS: ${{ inputs.probe_calls }}
          ACME_PROBE_TABLE: ${{ runner.temp }}/probe-table.md
          ACME_PROOF_LOGS: ${{ runner.temp }}/probe-engine-logs.jsonl
        run: uv run pytest tests/live/test_agent_engine_traces.py -m live -q -s -k unary_probe
      - name: Publish the trace table
        if: always()
        run: |
          cat "${{ runner.temp }}/trace-table.md" >> "$GITHUB_STEP_SUMMARY" || true
          cat "${{ runner.temp }}/rebuild-summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          cat "${{ runner.temp }}/probe-table.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: "Upload the trace inventory (no PII, acme.* values scrubbed)"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trace-inventory
          path: ${{ runner.temp }}/trace-inventory.json
          if-no-files-found: ignore
          retention-days: 14
      - name: "Upload the engine diagnostics (allowlisted ACME_DIAG fields only, 1 day)"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-logs
          path: |
            ${{ runner.temp }}/engine-logs.jsonl
            ${{ runner.temp }}/rebuild-engine-logs.jsonl
            ${{ runner.temp }}/probe-engine-logs.jsonl
          if-no-files-found: ignore
          retention-days: 1

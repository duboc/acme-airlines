name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # #234: third-party actions must be pinned to a commit SHA (they run with deploy rights).
  action-pins:
    name: action-pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .github/scripts/check_action_pins.py
      - run: python3 -m unittest discover -s .github/scripts -v

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No python-version here: it makes setup-uv create a root .venv and export VIRTUAL_ENV,
      # which mismatches app/backend/.venv. uv reads app/backend/.python-version instead.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: app/backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      # #232: coverage is measured; below the overall floor (pyproject fail_under) the job fails.
      # #282: 4 xdist workers (a public-repo runner has 4 vCPUs); `worksteal` keeps the long preset
      # tests from queueing behind each other. pytest-cov merges the workers' coverage data.
      - run: uv run pytest -m "not live" --cov --cov-branch -n 4 --dist worksteal --durations=20
      - name: Policy code needs 100% branch coverage
        run: uv run coverage report --include='src/acme/policy/*' --fail-under=100
      # #280: timing is only meaningful without the coverage tracer (it is skipped above).
      - name: Rebuild latency budget (#280, no coverage)
        run: uv run pytest -m budget --no-cov -q -s

  # #185: the engines crashed at container start-up (no top-level `acme` in the extra_packages
  # tarball). Stage the deploy artifacts exactly as the SDK uploads them, then load them in a
  # clean virtualenv that has ONLY the engine requirements, and run set_up and a query offline.
  engine-smoke:
    name: engine-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: app/backend/uv.lock
      - run: uv sync --frozen
      - name: Stage the engine artifacts
        run: uv run python -W ignore -m acme.engines.stage "$RUNNER_TEMP/staged"
      - name: Clean venv with only the engine requirements
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" -r "$RUNNER_TEMP/staged/requirements.txt"
      - name: Load, set_up and query the engines offline
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/clean/bin/python" -W ignore "$GITHUB_WORKSPACE/app/backend/scripts/engine_smoke.py" "$RUNNER_TEMP/staged"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

name: Containers

on:
  pull_request:
    paths:
      - "app/**"
      - "app/demo/**"
      - ".github/workflows/containers.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "app/demo/**"
      - ".github/workflows/containers.yml"

permissions:
  contents: read
  security-events: write # upload Trivy SARIF to code scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    name: containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LLM_MODE: fake
      COMPOSE: docker compose -f app/compose.yaml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate throwaway per-caller tokens (masked, never stored)
        run: |
          C=$(openssl rand -hex 24); S=$(openssl rand -hex 24); A=$(openssl rand -hex 24)
          echo "::add-mask::$C"; echo "::add-mask::$S"; echo "::add-mask::$A"
          echo "ACME_SIM_TOKENS=customer=$C,sales=$S,test-admin=$A" >> "$GITHUB_ENV"
          echo "ACME_SALES_TOKEN=$S" >> "$GITHUB_ENV"

      - name: Build every image
        run: $COMPOSE build

      - name: Images run as a non-root user
        run: |
          for img in acme-backend:local acme-frontend:local; do
            user=$(docker image inspect -f '{{.Config.User}}' "$img")
            echo "$img -> user='$user'"
            case "$user" in ""|root|0|0:*|root:*) echo "::error::$img runs as root"; exit 1;; esac
          done

      - name: No .env files or key material inside the images
        run: |
          for img in acme-backend:local acme-frontend:local; do
            id=$(docker create "$img")
            docker export "$id" | tar -tf - > /tmp/files.txt
            docker rm "$id" > /dev/null
            # public CA bundles (system, certifi, grpc) are expected; anything else is a finding
            if grep -E '(^|/)\.env($|\.)|\.pem$|\.key$|id_rsa|-sa-key\.json$|credentials\.json$' /tmp/files.txt \
               | grep -Ev '^(etc/ssl[0-9.]*/|usr/lib/ssl/|usr/share/ca-certificates/)|/(certifi/cacert|grpc/_cython/_credentials/roots)\.pem$'; then
              echo "::error::$img contains env/key files"; exit 1
            fi
            echo "$img: clean ($(wc -l < /tmp/files.txt) files)"
          done

      - name: Secrets scan (trivy, fail on HIGH/CRITICAL)
        # --skip-files: google-auth's bytecode contains the literal PEM header string it parses (a
        # known false positive: a library marker, not key material).
        run: |
          for img in acme-backend:local acme-frontend:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.57.1 image --scanners secret --severity HIGH,CRITICAL \
              --skip-files /app/.venv/lib/python3.12/site-packages/google/auth/crypt/__pycache__/_python_rsa.cpython-312.pyc \
              --exit-code 1 --no-progress "$img"
          done

      - name: Vulnerability scan (trivy, fail on CRITICAL with a fix available, SARIF)
        # Fails only on CRITICAL findings that have a fixed version (`--ignore-unfixed`) and are not in
        # the time-boxed .github/.trivyignore; the SARIF report (all findings) is never filtered.
        run: |
          mkdir -p trivy-sarif
          for img in acme-backend:local acme-frontend:local; do
            out="trivy-sarif/${img%%:*}.sarif"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/trivy-sarif:/out" \
              aquasec/trivy:0.57.1 image --scanners vuln --format sarif \
              --output "/out/$(basename "$out")" --no-progress "$img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.github/.trivyignore:/.trivyignore:ro" \
              aquasec/trivy:0.57.1 image --scanners vuln --severity CRITICAL --ignore-unfixed \
              --ignorefile /.trivyignore --exit-code 1 --no-progress "$img"
          done

      # One SARIF run per category (code scanning rejects several runs with the same category).
      - name: Upload Trivy SARIF (backend)
        if: always() && hashFiles('trivy-sarif/acme-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          sarif_file: trivy-sarif/acme-backend.sarif
          category: trivy-acme-backend

      - name: Upload Trivy SARIF (frontend)
        if: always() && hashFiles('trivy-sarif/acme-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          sarif_file: trivy-sarif/acme-frontend.sarif
          category: trivy-acme-frontend

      - name: Bring the stack up (fake LLM) and wait for health
        run: |
          $COMPOSE up -d
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/openapi.json > /dev/null; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::stack did not become healthy"; $COMPOSE ps; $COMPOSE logs; exit 1

      - name: Smoke test through the frontend proxy
        run: |
          set -e
          curl -fsS -X POST http://127.0.0.1:8080/api/scenario/trigger-cancellation \
            -H 'content-type: application/json' \
            -d '{"flight":"AC1234","reason":"unscheduled maintenance"}' | tee /tmp/trigger.json
          jid=$(jq -r '.journey_ids[0]' /tmp/trigger.json)
          status=$(curl -fsS "http://127.0.0.1:8080/api/journeys/$jid" | jq -r '.status')
          echo "journey $jid status=$status"
          test "$status" = "RESOLVED"
          # the agent-to-agent endpoint is not reachable from the browser side
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/a2a)" = "404"

      - name: Sales cannot reach the passenger API port (8800), only A2A (8802)
        run: |
          set -e
          $COMPOSE exec -T sales-agent python - <<'PY'
          import socket
          for port, want in ((8800, False), (8802, True)):
              s = socket.socket(); s.settimeout(3)
              try:
                  s.connect(("customer-runtime", port)); got = True
              except OSError:
                  got = False
              assert got == want, f"customer-runtime:{port} reachable={got}, expected {want}"
          print("sales: 8800 unreachable, 8802 reachable")
          PY

      - name: Sales credential reaches only the inventory server (403 elsewhere)
        run: |
          set -e
          $COMPOSE exec -T sales-agent python - <<'PY'
          import os, urllib.error, urllib.request
          tok = os.environ["ACME_SALES_TOKEN"]
          def code(server):
              req = urllib.request.Request(
                  f"http://acme-sim:8700/mcp/{server}/", data=b"{}", method="POST",
                  headers={"Authorization": f"Bearer {tok}", "content-type": "application/json"})
              try:
                  return urllib.request.urlopen(req).status
              except urllib.error.HTTPError as e:
                  return e.code
          for s in ["pss", "whatsapp", "payments", "crm", "dcs", "loyalty"]:
              assert code(s) == 403, (s, code(s))
          assert code("inventory") != 403
          print("sales: 403 on every non-inventory server, inventory allowed")
          PY

      - name: Single-container demo image (build, non-root, smoke)
        run: |
          docker build -f app/demo/Dockerfile -t acme-demo:local app
          user=$(docker image inspect -f '{{.Config.User}}' acme-demo:local)
          echo "acme-demo:local -> user='$user'"
          case "$user" in ""|root|0|0:*|root:*) echo "::error::demo image runs as root"; exit 1;; esac
          docker run -d --name demo -p 127.0.0.1:8090:8080 acme-demo:local
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8090/api/openapi.json > /dev/null && break; sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8090/api/scenario/trigger-cancellation \
            -H 'content-type: application/json' \
            -d '{"flight":"AC1234","reason":"unscheduled maintenance"}' > /tmp/demo-trigger.json
          jid=$(jq -r '.journey_ids[0]' /tmp/demo-trigger.json)
          test "$(curl -fsS "http://127.0.0.1:8090/api/journeys/$jid" | jq -r '.status')" = "RESOLVED"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8090/api/a2a)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/mcp/pss/)" = "404"
          curl -fsS http://127.0.0.1:8090/ | grep -qi '<html'
          # tokens are generated at startup and must never reach the logs
          ! docker logs demo 2>&1 | grep -E 'customer=[0-9a-f]{48}|sales=[0-9a-f]{48}'
          docker rm -f demo

      - name: Demo image in ENGINE_MODE=agent-engine without credentials (smoke, #199)
        run: |
          docker run -d --name demo-ae -p 127.0.0.1:8091:8080 \
            -e ENGINE_MODE=agent-engine -e AGENT_ENGINE_CUSTOMER=dummy -e AGENT_ENGINE_SALES=dummy \
            acme-demo:local
          ok=
          for i in $(seq 1 10); do
            curl -fsS http://127.0.0.1:8091/api/healthz > /tmp/ae-health.json && ok=1 && break; sleep 1
          done
          test -n "$ok" || { echo "::error::agent-engine mode did not listen within 10s"; exit 1; }
          test "$(jq -r '.engine' /tmp/ae-health.json)" = "agent-engine"
          # a bad/absent engine surfaces as a clear 503 at request time, never a startup crash
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8091/api/scenarios)" = "503"
          docker rm -f demo-ae

      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Demo logs on failure
        if: failure()
        run: |
          docker logs demo 2>&1 || true
          docker logs demo-ae 2>&1 || true

      - name: Tear down
        if: always()
        run: $COMPOSE down -v --remove-orphans

name: IRROPS Demo Deploy

# Keyless deploy via Workload Identity Federation (same OBSERVATORY_* variables as
# observatory-deploy). WIF trusts only refs/heads/main. Only --image is swapped (plus ENGINE_MODE, chosen by app/demo/select-engine-mode.sh) on the existing
# Cloud Run service; if the platform script has not created it yet, the job warns and succeeds.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/irrops-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irrops-deploy
  cancel-in-progress: false

env:
  # `local` until #181 (phone/reset/trigger parity) lands; then flip to `auto`.
  HOSTED_ENGINE_MODE: local
  AR_REPO: ${{ vars.IRROPS_AR_REPO }}
  SERVICE: ${{ vars.IRROPS_DEMO_SERVICE }}
  REGION: ${{ vars.OBSERVATORY_REGION }}
  PROJECT: ${{ vars.OBSERVATORY_PROJECT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.OBSERVATORY_WIF_PROVIDER }}
          service_account: ${{ vars.OBSERVATORY_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Check the service exists
        id: exists
        run: |
          if [ -z "$AR_REPO" ] || [ -z "$SERVICE" ]; then
            echo "::warning::IRROPS_AR_REPO / IRROPS_DEMO_SERVICE are not set; skipping deploy (platform script not run yet)"
            echo "present=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(metadata.name)' > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloud Run service '$SERVICE' does not exist yet; skipping deploy"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the demo image
        if: steps.exists.outputs.present == 'true'
        run: |
          gcloud auth configure-docker "${AR_REPO%%/*}" --quiet
          docker build -f app/demo/Dockerfile -t "$AR_REPO/irrops-demo:$GITHUB_SHA" app
          docker push "$AR_REPO/irrops-demo:$GITHUB_SHA"

      - name: Deploy (image only)
        if: steps.exists.outputs.present == 'true'
        run: |
          gcloud run deploy "$SERVICE" --image "$AR_REPO/irrops-demo:$GITHUB_SHA" \
            --region "$REGION" --project "$PROJECT" --quiet

      - name: Select ENGINE_MODE
        if: steps.exists.outputs.present == 'true'
        run: |
          names=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" \
            --format=json | jq -r '.spec.template.spec.containers[0].env[]?.name')
          mode=$(sh app/demo/select-engine-mode.sh "$HOSTED_ENGINE_MODE" $names)
          echo "ENGINE_MODE=$mode"
          gcloud run services update "$SERVICE" --update-env-vars "ENGINE_MODE=$mode" \
            --region "$REGION" --project "$PROJECT" --quiet

      - name: Verify the deployed image SHA
        if: steps.exists.outputs.present == 'true'
        run: |
          img=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" \
            --format='value(spec.template.spec.containers[0].image)')
          echo "deployed: $img"
          case "$img" in *"irrops-demo:$GITHUB_SHA"*|*"irrops-demo@"*) ;; *) echo "::error::deployed image is not $GITHUB_SHA"; exit 1;; esac

name: Observatory Deploy

# Keyless deploy via Workload Identity Federation. WIF trusts only refs/heads/main, so this
# cannot be exercised from a PR branch. Only --image is swapped on the existing Cloud Run
# service and job; auth, IAP, networking, env and the runtime service accounts are unchanged.
# The exceptions are the collector's GITHUB_TOKEN secret, added with --update-secrets (not
# --set-secrets, which would replace and drop the existing SCION_HUB_TOKEN), and its HUB_PROJECT
# env var, set with --update-env-vars (not --set-env-vars, which would replace all env vars).

# Live Observatory deploys are owned by the `eval-dashboard` trunk (#359); main's
# `observatory/` tree is frozen and must never auto-deploy on push to main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observatory-deploy
  cancel-in-progress: false

env:
  AR_REPO: ${{ vars.OBSERVATORY_AR_REPO }}
  REGION: ${{ vars.OBSERVATORY_REGION }}
  PROJECT: ${{ vars.OBSERVATORY_PROJECT }}
  # Hub project UUID (not the slug): the hub REST API /projects/<id>/agents rejects the slug.
  HUB_PROJECT: 61b6ae3d-9335-4360-a259-5b306dc229f6

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.OBSERVATORY_WIF_PROVIDER }}
          service_account: ${{ vars.OBSERVATORY_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${AR_REPO%%/*}" --quiet

      - name: Build and push images
        id: build
        run: |
          docker build -t "$AR_REPO/dashboard:$GITHUB_SHA" observatory/dashboard
          docker push "$AR_REPO/dashboard:$GITHUB_SHA"
          docker build -t "$AR_REPO/collector:$GITHUB_SHA" observatory/collector
          docker push "$AR_REPO/collector:$GITHUB_SHA"

      # Dashboard first, so a collector-secret problem can never block it.
      - name: Deploy dashboard (image only)
        run: |
          gcloud run deploy acme-observatory \
            --image "$AR_REPO/dashboard:$GITHUB_SHA" \
            --region "$REGION" --project "$PROJECT" --quiet

      # Maps GITHUB_TOKEN only when its secret has a version, else removes the mapping and warns.
      # Decision logic and tests: observatory/deploy/.
      - name: Deploy collector job
        env:
          IMG: ${{ vars.OBSERVATORY_AR_REPO }}/collector:${{ github.sha }}
        run: observatory/deploy/deploy-collector.sh

      # Runs even if a deploy step failed, so a half-deployed state is reported; the job still fails.
      - name: Verify deployed images, SCION_HUB_TOKEN mapping and HUB_PROJECT
        if: always() && steps.build.outcome == 'success'
        run: observatory/deploy/verify-deploy.sh

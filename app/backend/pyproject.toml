[project]
name = "acme"
version = "0.1.0"
description = "ACME Airlines agent backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14.0",
    "google-genai>=2.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = [
    "live: calls live external services (e.g. Vertex AI); deselected by default and in CI",
]

[project]
name = "acme"
version = "0.1.0"
description = "ACME Airlines agent backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.9,<2",
    "pydantic>=2.14.1",
    "google-genai>=2.29.0",
    "fastapi>=0.133,<0.142",
    "google-adk[a2a]>=1.28.1,<2",
    "google-cloud-aiplatform[adk,agent-engines]>=1.112,<2",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-gcp-trace>=1.9",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-gcp-monitoring>=1.9",
]

[project.scripts]
acme-sim = "acme.sim.app:main"
acme-customer = "acme.customer.main:main"
acme-sales = "acme.sales.main:main"
acme-demo = "acme.demo.supervisor:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.169.0",
    "mutmut>=3.8.0",
    "opentelemetry-sdk>=1.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme"]

[tool.ruff]
extend-exclude = ["mutants"]  # mutmut's working copy (#232)
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = [
    "live: calls live external services (e.g. Vertex AI); deselected by default and in CI",
    "stress: long multi-process stress test (about 30 s); skipped unless selected with -m stress (#288)",
    "budget: timing budget, CPU-load dependent; skipped unless selected with -m budget (#280)",
]

# Mutation testing of the policy code (#232): `uv run mutmut run`, see docs/product/test-strategy.md.
[tool.mutmut]
source_paths = ["src"]
only_mutate = [
    "src/acme/policy/*",
    "src/acme/llm/bounded.py",
    "src/acme/api/a2a_guard.py",
    "src/acme/customer/intent.py",
    "src/acme/customer/service_closure.py",
]
timeout_constant = 60.0
timeout_multiplier = 5.0
pytest_add_cli_args_test_selection = [
    "tests/policy",
    "tests/governance/test_policy_properties.py",
    "tests/governance/test_claims_vs_inventory.py",
    "tests/governance/test_state.py",
    "tests/customer/test_llm_timeout.py",
    "tests/customer/test_llm_timeout_audit.py",
    "tests/governance/test_sales_route_enforcement.py",
    "tests/governance/test_sales_guard_audit.py",
    "tests/governance/test_service_closure.py",
    "tests/governance/test_service_closure_decision.py",
    "tests/engines/test_parse_fallback.py",
]

# Coverage gates (#232). CI runs `pytest --cov --cov-branch`, then requires 100% branch coverage of
# src/acme/policy (coverage report --include ... --fail-under=100) and this overall floor.
# Baseline measured 94.7% (statements+branches) on 2026-10-13; raise it when coverage improves.
[tool.coverage.run]
source = ["acme"]
branch = true

[tool.coverage.report]
fail_under = 94
show_missing = true
skip_covered = true

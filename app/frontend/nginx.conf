server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Agent-to-agent traffic is never reachable from a browser.
    location ^~ /api/a2a { return 404; }
    location ^~ /api/.well-known/ { return 404; }
    location ~* ^/api/(a2a|\.well-known|mcp)(/|$) { return 404; }

    # The UI calls /api/*; the runtime serves routes at the root. SSE needs buffering off.
    location /api/ {
        if ($request_uri ~* "^/api/[^?]*%[0-9a-f]{2}") { return 404; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://customer-runtime:8800;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}

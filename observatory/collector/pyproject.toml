[project]
name = "collector"
version = "0.1.0"
description = "ACME Observatory collector: snapshots hub agents and GitHub flow into BigQuery"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-cloud-bigquery>=3.25",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
collector = "collector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "dashboard"
version = "0.1.0"
description = "ACME Observatory dashboard API (read-only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-cloud-bigquery>=3.25",
    "google-cloud-monitoring>=2.22",
    "google-cloud-logging>=3.10",
    "google-cloud-trace>=1.21.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient.*",
]
